<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argia Etxea · Alquileres</title>
<meta name="theme-color" content="#f5f3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Argia Etxea">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1f2421; --muted:#6b706c; --line:#e4e1d8;
  --accent:#2f5d50; --accent-soft:#e3ece8; --in:#2f7d5b; --out:#b4533a; --warn:#c08a1e;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;line-height:1.2}
header.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0;color:var(--accent)}
.brand svg.logo{height:38px;width:auto;flex-shrink:0}
.brand b{display:block;font-size:16px;color:var(--ink);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.seg{display:flex;background:#e9e6de;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#ece7f4;color:#5a4a86;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.cmp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.fixed-row{display:grid;grid-template-columns:1.4fr 1.2fr .9fr auto;gap:8px;align-items:end;margin-bottom:8px}
.fixed-row label{font-size:11px}
.xbtn{border:none;background:#f6e3de;color:var(--out);border-radius:10px;width:40px;height:42px;cursor:pointer;font-size:18px}
.periodo{display:flex;gap:6px}
.login{max-width:380px;margin:40px auto;padding:0 16px}
.login .logo-big{color:var(--accent);text-align:center;margin-bottom:18px}
.login .logo-big svg{height:90px;width:auto}
body.out nav.tabs,body.out .periodo{display:none}
body.tenant nav.tabs{display:none}
body.tenant{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
.periodo select{width:auto;padding:6px 8px;min-height:36px;font-size:14px}
main{padding:14px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .sub{font-size:12px;color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;min-height:44px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 10px;min-height:36px}
.btn.danger{background:#f6e3de;color:var(--out)}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.grid-cobros{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid-cobros table{border-collapse:collapse;width:100%;min-width:520px}
.grid-cobros th{font-size:11px;color:var(--muted);font-weight:500;padding:4px 2px}
.grid-cobros td{text-align:center;padding:4px 2px}
.grid-cobros td.n{text-align:left;font-size:14px;font-weight:600;white-space:nowrap;padding-right:8px}
.dot{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dot.ok{background:var(--in);color:#fff}
.dot.pend{background:#f3e6c8;color:var(--warn)}
.dot.fut{background:#eeece6;color:#bbb}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 84px;gap:8px;align-items:center;font-size:14px}
.bar .t{height:10px;background:#efece5;border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--out);border-radius:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mov{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mov:last-child{border-bottom:none}
.mov .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.mov .ic.i{background:#e2f0e8}.mov .ic.g{background:#f6e6e1}
.mov .b{flex:1;min-width:0}
.mov .b .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .b .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .clip{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:6px 2px;cursor:pointer;min-width:0;flex:1}
nav.tabs button.add .p{width:46px!important}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.add{color:#fff}
nav.tabs button.add .p{background:var(--accent);border-radius:16px;width:52px;height:40px;display:flex;align-items:center;justify-content:center;margin-top:-4px}
nav.tabs button.add span{color:var(--accent);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.notice{background:#fbf3df;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;color:#6a5216}
.notice.ok{background:#e2f0e8;color:#1f5a3f}
.notice.err{background:#f6e3de;color:#8a3a26}
.preview{margin:8px 0 12px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.preview img{display:block;width:100%;max-height:260px;object-fit:contain;background:#fafafa}
.preview .pdf{padding:14px;font-size:14px}
.addbig{display:grid;gap:12px}
.addbig button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer}
.addbig .e{font-size:26px;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);flex-shrink:0}
.addbig b{display:block;font-size:16px}
.addbig small{color:var(--muted);font-size:13px}
.room{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fcfbf8}
.room .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.room .hd input{font-weight:600}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f4 label{font-size:11px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.toggle input{width:auto;min-height:auto}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.status{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
svg.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
@media (max-width:420px){.kpi .v{font-size:16px}.bar{grid-template-columns:90px 1fr 74px}.f4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
(function(){
"use strict";
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MES3=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
// [nombre, icono, es suministro, es gasto de la casa]
const BASE_CATS={luz:["Luz","💡",1,0],gas:["Gas","🔥",1,0],agua:["Agua / Mancomunidad","💧",1,0],internet:["Internet","📶",1,0],
  hipoteca:["Hipoteca","🏦",0,1],serviam:["Serviam","📑",0,1],mybox:["MyBox (recibo único)","📦",0,1],seguro:["Seguro","🛡️",0,1],ibi:["Contribución urbana","🏛️",0,1],comunidad:["Comunidad","🏢",0,0],
  limpieza:["Limpieza","🧽",0],mantenimiento:["Mantenimiento","🔧",0],reparaciones:["Reparaciones","🛠️",0],compras:["Compras casa","🛒",0],otros:["Otros","📄",0]};
let CATS=Object.assign({},BASE_CATS);
let CAT_KEYS=Object.keys(CATS);
function rebuildCats(){
  CATS=Object.assign({},BASE_CATS);
  const ex=(S.config&&S.config.partidas)||[];
  const otros=CATS.otros;delete CATS.otros;
  ex.forEach(p=>{if(p&&p.id&&p.nombre&&!BASE_CATS[p.id])CATS[p.id]=[p.nombre,p.icono||"🏷️",0,p.casa?1:0]});
  CATS.otros=otros;CAT_KEYS=Object.keys(CATS);
}
const DEF_CONFIG={casa:"Calvario, 5",personasReparto:5,reparto:"alquiladas",habitaciones:[],partidas:[]};
const isCasa=m=>m.tipo==="gasto"&&!!(CATS[m.categoria]||CATS.otros)[3];
let modo0="alquiler";try{modo0=localStorage.getItem("modo")||"alquiler"}catch(_){}
const S={db:null,user:null,assets:null,sample:null,downloads:null,canWrite:null,
  config:null,movs:[],movsLoaded:false,cfgLoaded:false,view:"resumen",tipo:"todos",
  year:new Date().getFullYear(),month:"all",modo:modo0,names:{},timer:null,stale:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const fmt=v=>eur.format(Math.round((+v||0)*100)/100);
const num=v=>{if(typeof v==="number")return v;const s=String(v||"").trim().replace(/\s|€/g,"");if(!s)return 0;const n=s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s);return isNaN(n)?0:n};
const r2=v=>Math.round(v*100)/100;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ymNow=()=>today().slice(0,7);
const ymLabel=ym=>{if(!ym)return "";const [y,m]=ym.split("-");return MESES[+m-1]+" "+y};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
const cfg=()=>S.config||DEF_CONFIG;
const rooms=()=>cfg().habitaciones||[];
const roomName=id=>id==="casa"||!id?"Casa (general)":((rooms().find(r=>r.id===id)||{}).nombre||id);

/* ---------- reparto por meses ---------- */
function alloc(m){
  const imp=+m.importe||0;
  if(m.tipo==="ingreso")return [{ym:m.mesCuota||(m.fecha||"").slice(0,7),v:imp}];
  if(m.periodoDesde&&m.periodoHasta&&m.periodoHasta>=m.periodoDesde){
    const d0=Date.parse(m.periodoDesde+"T00:00:00Z"),d1=Date.parse(m.periodoHasta+"T00:00:00Z");
    const days=Math.round((d1-d0)/864e5)+1;
    if(days>0&&days<=400){const map={};for(let i=0;i<days;i++){const ym=new Date(d0+i*864e5).toISOString().slice(0,7);map[ym]=(map[ym]||0)+1}
      return Object.entries(map).map(([ym,n])=>({ym,v:imp*n/days}))}
  }
  return [{ym:(m.fecha||"").slice(0,7),v:imp}];
}
const inPeriod=ym=>ym&&ym.startsWith(S.year+"-")&&(S.month==="all"||+ym.slice(5,7)===S.month);
const refYm=m=>m.tipo==="ingreso"?(m.mesCuota||(m.fecha||"").slice(0,7)):(m.fecha||"").slice(0,7);

/* ---------- selectores ---------- */
function fillSelectors(){
  const ys=new Set([new Date().getFullYear(),S.year]);
  S.movs.forEach(m=>{const y=+refYm(m).slice(0,4);if(y)ys.add(y)});
  const sa=$("#selAnio");sa.innerHTML=[...ys].sort((a,b)=>b-a).map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("");
  const sm=$("#selMes");sm.innerHTML=`<option value="all">Todo el año</option>`+MESES.map((n,i)=>`<option value="${i+1}" ${S.month===i+1?"selected":""}>${n}</option>`).join("");
}
$("#selAnio").onchange=e=>{S.year=+e.target.value;render()};
$("#selMes").onchange=e=>{S.month=e.target.value==="all"?"all":+e.target.value;render()};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.v==="nuevo"){openAdd();return}
  S.view=b.dataset.v;S.hab=null;if(S.view==="documentos")S.docs=null;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render();window.scrollTo(0,0)});

/* ---------- render ---------- */
function render(){
  $("#casa").textContent=cfg().casa||"";
  fillSelectors();
  const main=$("#main");
  if(S.tenant){$("#main").innerHTML=viewTenant();bindTenant();return}
  if(!S.db)return;
  if(!S.movsLoaded||!S.cfgLoaded){main.innerHTML=`<div class="empty"><span class="spin"></span>Cargando datos…${S.stale?"<br><br>Tarda más de lo normal; puede que no haya conexión.":""}</div>`;return}
  let h=S.stale?`<div class="notice">No se ha podido confirmar la conexión: los datos pueden no estar al día.</div>`:"";
  if(S.canWrite===false)h+=`<div class="notice">Tienes acceso de solo lectura.</div>`;
  if(S.view==="resumen")h+=viewResumen();
  else if(S.view==="movimientos")h+=viewMovs();
  else if(S.view==="habitaciones")h+=S.hab?viewHab(S.hab):viewHabs();
  else if(S.view==="documentos")h+=viewDocs();
  else h+=viewAjustes();
  main.innerHTML=h;
  bindView();
}

function totals(){
  let ing=0,gasA=0,gasC=0;const cat={};let cons=0,sumi=0;
  const byM=Array.from({length:12},()=>({i:0,g:0,c:0}));
  S.movs.forEach(m=>{const casa=isCasa(m);alloc(m).forEach(a=>{
    if(!a.ym||!a.ym.startsWith(S.year+"-"))return;
    const mi=+a.ym.slice(5,7)-1;
    if(m.tipo==="ingreso")byM[mi].i+=a.v;else if(casa)byM[mi].c+=a.v;else byM[mi].g+=a.v;
    if(!inPeriod(a.ym))return;
    if(m.tipo==="ingreso"){ing+=a.v;cons+=a.v*((+((m.desglose||{}).consumos)||0)/((+m.importe)||1))}
    else{if(casa)gasC+=a.v;else gasA+=a.v;const c=CATS[m.categoria]?m.categoria:"otros";cat[c]=(cat[c]||0)+a.v;if(CATS[c][2])sumi+=a.v}
  })});
  return {ing,gasA,gasC,cat,cons,sumi,byM};
}

function viewResumen(){
  const t=totals();const total=S.modo==="total";
  const gas=t.gasA+(total?t.gasC:0);const res=t.ing-gas;
  const resA=t.ing-t.gasA,resT=t.ing-t.gasA-t.gasC;
  const per=S.month==="all"?`Año ${S.year}`:`${MESES[S.month-1]} ${S.year}`;
  let h=`<div class="seg" role="tablist"><button data-modo="alquiler" class="${total?"":"on"}">Gastos del alquiler</button><button data-modo="total" class="${total?"on":""}">+ Gastos de la casa</button></div>
  <div class="kpis">
   <div class="kpi"><div class="l">Ingresos</div><div class="v in">${fmt(t.ing)}</div></div>
   <div class="kpi"><div class="l">Gastos</div><div class="v out">${fmt(gas)}</div></div>
   <div class="kpi"><div class="l">Resultado</div><div class="v ${res>=0?"in":"out"}">${fmt(res)}</div></div></div>`;
  h+=`<div class="card"><h2 data-an="casa" style="cursor:pointer">Con y sin gastos de la casa <span class="sub">${per} · ver análisis ›</span></h2>
   <div class="row"><span>Resultado solo con gastos del alquiler</span><b class="num ${resA>=0?"in":"out"}">${fmt(resA)}</b></div>
   <div class="row" data-cat="__casa" style="cursor:pointer"><span>Gastos de la casa <span class="small muted">(hipoteca, seguros, contribución…)</span></span><b class="num out">−${fmt(t.gasC)} ›</b></div>
   <div class="row"><span><b>Resultado incluyendo la casa</b></span><b class="num ${resT>=0?"in":"out"}">${fmt(resT)}</b></div>
   ${t.ing&&t.gasC?`<div class="small muted" style="margin-top:8px">Lo que deja el alquiler cubre el ${Math.round(Math.max(0,resA)/t.gasC*100)}% de los gastos de la casa.</div>`:""}
   <button class="btn sec block" style="margin-top:10px" data-an="casa">Ver por qué sale este resultado</button></div>`;
  h+=cobrosCard();
  const dif=t.cons-t.sumi;const falt=faltanFacturas();
  h+=`<div class="card" data-an="sum" style="cursor:pointer"><h2>Suministros <span class="sub">${per} · ver análisis ›</span></h2>
   <div class="row"><span>Coste real (luz, gas, agua, internet)</span><b class="num out">${fmt(t.sumi)}</b></div>
   <div class="row"><span>Parte de cada habitación (÷${partes()})</span><b class="num">${fmt(t.sumi/partes())}</b></div>
   <div class="row"><span>Cuotas de consumos cobradas</span><b class="num in">${fmt(t.cons)}</b></div>
   <div class="row"><span>${dif>=0?"Las cuotas cubren el coste con":"Faltan para cubrir el coste"}</span><b class="num ${dif>=0?"in":"out"}">${fmt(Math.abs(dif))}</b></div>
   ${falt.length?`<div class="notice" style="margin:10px 0 0">Faltan facturas por apuntar: ${esc(falt.map(f=>f.txt).join("; "))}. Hasta entonces el coste sale más bajo de lo real.</div>`:""}
   <div class="small muted" style="margin-top:8px">Las facturas con periodo (p. ej. gas bimestral) se reparten entre los meses que cubren.</div></div>`;
  h+=`<div class="card"><h2>Mes a mes <span class="sub">${S.year}</span></h2>${chart(t.byM,total)}
   <div class="legend"><span style="--c:var(--in)">Ingresos</span><span style="--c:var(--out)">Gastos alquiler</span>${total?`<span style="--c:#7a68a8">Gastos casa</span>`:""}</div></div>`;
  const cs=Object.entries(t.cat).filter(([c])=>total||!CATS[c][3]).sort((a,b)=>b[1]-a[1]);const mx=cs.length?cs[0][1]:1;
  const totG=cs.reduce((x,[,v])=>x+v,0);
  const porHab=S.partVista==="hab";
  h+=`<div class="card"><h2>Gastos <span class="sub">${per}</span></h2>
   <div class="seg" style="margin-bottom:12px"><button data-pv="part" class="${porHab?"":"on"}">Por partida</button><button data-pv="hab" class="${porHab?"on":""}">Por habitación</button></div>`;
  if(!porHab){
   h+=(cs.length?`<div class="bars">${cs.map(([c,v])=>`<div class="bar" data-cat="${c}" role="button" tabindex="0" style="cursor:pointer"><span>${CATS[c][1]} ${esc(CATS[c][0])}</span><div class="t"><i style="width:${Math.max(2,v/mx*100)}%;${CATS[c][3]?"background:#7a68a8":""}"></i></div><b class="num" style="text-align:right">${fmt(v)} ›</b></div>`).join("")}</div>
    <div class="row" style="margin-top:8px;border-top:2px solid var(--line)"><b>Total gastos</b><b class="num out">${fmt(totG)}</b></div>
    <div class="small muted" style="margin-top:6px">Toca una partida para ver su detalle por meses.</div>`
   :`<div class="empty">Sin gastos en este periodo.</div>`);
  }else{
   const d=reparto();const mxh=Math.max(1,...d.rows.map(r=>r.total),d.resto);
   h+=`<div class="bars">${d.rows.map(r=>`<div class="bar" data-hab="${esc(r.id)}" style="cursor:pointer"><span>${esc(r.nombre)}</span><div class="t"><i style="width:${r.total?Math.max(2,r.total/mxh*100):0}%"></i></div><b class="num" style="text-align:right">${fmt(r.total)} ›</b></div>`).join("")}
    ${d.resto>0.005?`<div class="bar"><span class="muted">${repartoPersonas()?"Familia":"Resto de la casa"}</span><div class="t"><i style="width:${d.resto?Math.max(2,d.resto/mxh*100):0}%;background:#bbb"></i></div><b class="num muted" style="text-align:right">${fmt(d.resto)}</b></div>`:""}</div>
    <div class="row" style="margin-top:8px;border-top:2px solid var(--line)"><b>Total gastos</b><b class="num out">${fmt(totG)}</b></div>
    <div class="small muted" style="margin-top:6px">Cada habitación alquilada lleva sus gastos propios más 1/${d.partes} de los gastos comunes (reparto entre ${partesTxt()}).${repartoPersonas()?' "Familia" es vuestra parte.':' Las habitaciones sin alquilar solo llevan sus gastos propios.'}</div>`;
  }
  h+=`</div>`;
  return h;
}

/* ---------- reparto por habitación ---------- */
const repartoPersonas=()=>cfg().reparto==="personas";
const habsReparto=()=>rooms().filter(r=>r.activa!==false);
function partes(){if(S.partesFijas)return S.partesFijas;return repartoPersonas()?Math.max(1,+cfg().personasReparto||1):Math.max(1,habsReparto().length)}
const partesTxt=()=>repartoPersonas()?`${partes()} partes: cada habitación alquilada y la familia`:`las ${partes()} habitaciones alquiladas`;
function gastosHab(id){
  // gastos del periodo: propios de la habitación + su parte de los comunes
  const total=S.modo==="total";const N=partes();
  const propios=[];let prop=0;const comun={};let com=0;
  const rr=rooms().find(r=>r.id===id);const enReparto=!!rr&&rr.activa!==false;
  S.movs.forEach(m=>{
    if(m.tipo!=="gasto")return;if(isCasa(m)&&!total)return;
    const h=m.habitacion||"casa";
    if(h!==id&&h!=="casa")return;
    let v=0;alloc(m).forEach(a=>{if(inPeriod(a.ym))v+=a.v});
    if(!v&&!(h===id&&inPeriod(refYm(m))))return;
    if(h===id){prop+=v;propios.push(m)}
    else if(enReparto){const c=CATS[m.categoria]?m.categoria:"otros";comun[c]=(comun[c]||0)+v/N;com+=v/N}
  });
  return {prop,com,total:prop+com,propios,comun};
}
function reparto(){
  const rows=rooms().map(r=>{const g=gastosHab(r.id);return {id:r.id,nombre:r.nombre,total:g.total}});
  const t=totals();const all=t.gasA+(S.modo==="total"?t.gasC:0);
  const resto=Math.max(0,all-rows.reduce((x,r)=>x+r.total,0));
  return {rows,resto,partes:partes()};
}
function cobrosHab(id){
  let tot=0;const d={alquiler:0,consumos:0,limpieza:0,otros:0};
  S.movs.forEach(m=>{if(m.tipo==="ingreso"&&m.habitacion===id&&inPeriod(m.mesCuota||refYm(m))){tot+=+m.importe||0;const x=m.desglose||{};Object.keys(d).forEach(k=>d[k]+=+x[k]||0)}});
  return {tot,d};
}
function pendientesHab(id){
  const r=rooms().find(x=>x.id===id);if(!r||r.activa===false)return [];
  const now=ymNow();const out=[];
  for(let m=1;m<=12;m++){const ym=S.year+"-"+String(m).padStart(2,"0");if(ym>now)break;if(S.month!=="all"&&m!==S.month)continue;
    if(!S.movs.some(x=>x.tipo==="ingreso"&&x.habitacion===id&&x.mesCuota===ym))out.push(ym)}
  // no contar meses anteriores al primer cobro registrado (habitación aún no alquilada)
  const first=S.movs.filter(x=>x.tipo==="ingreso"&&x.habitacion===id).map(x=>x.mesCuota).sort()[0];
  return first?out.filter(ym=>ym>=first):out;
}

function chart(byM,total){
  const W=600,H=170,P=22,bw=(W-P)/12;const gv=x=>x.g+(total?x.c:0);const mx=Math.max(1,...byM.map(x=>Math.max(x.i,gv(x))));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Ingresos y gastos por mes">`;
  s+=`<line x1="${P}" x2="${W}" y1="${H}" y2="${H}" stroke="#e4e1d8"/>`;
  byM.forEach((x,i)=>{const x0=P+i*bw+bw*0.15,w=bw*0.33;
    const hi=x.i/mx*(H-10),hg=x.g/mx*(H-10),hc=total?x.c/mx*(H-10):0;
    s+=`<rect x="${x0}" y="${H-hi}" width="${w}" height="${hi}" rx="3" fill="#2f7d5b"><title>${MESES[i]}: ingresos ${fmt(x.i)}</title></rect>`;
    s+=`<rect x="${x0+w+2}" y="${H-hg}" width="${w}" height="${hg}" rx="3" fill="#b4533a"><title>${MESES[i]}: gastos alquiler ${fmt(x.g)}</title></rect>`;
    if(hc)s+=`<rect x="${x0+w+2}" y="${H-hg-hc}" width="${w}" height="${hc}" rx="3" fill="#7a68a8"><title>${MESES[i]}: gastos casa ${fmt(x.c)}</title></rect>`;
    s+=`<text x="${P+i*bw+bw/2}" y="${H+14}" text-anchor="middle">${MES3[i]}</text>`});
  s+=`<text x="0" y="10">${Math.round(mx)}€</text></svg>`;
  return s;
}

async function saveConfig(){
  const habitaciones=[...document.querySelectorAll("#roomsBox .room")].map((el,i)=>{
    const g=k=>el.querySelector(`[data-k="${k}"]`);const old=rooms()[i]||{};
    const nombre=g("nombre").value.trim();if(!nombre)return null;
    return {id:old.id||nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("hab"+i),
      nombre,inquilino:g("inquilino").value.trim(),alquiler:num(g("alquiler").value),consumos:num(g("consumos").value),
      limpieza:num(g("limpieza").value),otros:num(g("otros").value),otrosConcepto:g("otrosConcepto").value.trim(),activa:g("activa").checked};
  }).filter(Boolean);
  const used=new Set();
  const partidas=[...document.querySelectorAll("#partBox .fixed-row")].map(el=>{
    const g=k=>el.querySelector(`[data-k="${k}"]`);const nombre=g("nombre").value.trim();if(!nombre)return null;
    let id=el.dataset.id||("p-"+(slug(nombre)||"partida"));while(used.has(id)||BASE_CATS[id])id+="-2";used.add(id);
    return {id,nombre,icono:g("icono").value.trim()||"🏷️",casa:g("casa").checked};
  }).filter(Boolean);
  const data={casa:$("#cCasa").value.trim(),personasReparto:num($("#cPers").value)||1,reparto:$("#cRep").value,habitaciones,partidas};
  const b=$("#saveCfg");b.disabled=true;b.innerHTML='<span class="spin"></span>Guardando';
  try{await S.db.doc("config/main").set(data);toast("Cambios guardados")}
  catch(e){toast(errMsg(e))}finally{b.disabled=false;b.textContent="Guardar cambios"}
}

async function exportCsv(){
  const rows=[["Tipo","Mes referencia","Fecha","Habitación/Asignación","Categoría","Proveedor","Concepto","Periodo desde","Periodo hasta","Alquiler","Consumos","Limpieza","Otros","Importe","Nota","Factura"]];
  S.movs.filter(m=>refYm(m).startsWith(S.year+"-")).sort((a,b)=>refYm(a).localeCompare(refYm(b))).forEach(m=>{
    const d=m.desglose||{};
    rows.push([m.tipo,refYm(m),m.fecha||"",roomName(m.habitacion),m.tipo==="gasto"?(CATS[m.categoria]||CATS.otros)[0]:"Cuota",m.proveedor||"",m.concepto||"",m.periodoDesde||"",m.periodoHasta||"",
      d.alquiler||"",d.consumos||"",d.limpieza||"",d.otros||"",m.tipo==="gasto"?-(+m.importe||0):(+m.importe||0),m.nota||"",m.adjunto?(m.adjunto.nombre||"sí"):""]);
  });
  const csv="﻿"+rows.map(r=>r.map(v=>{let s=typeof v==="number"?String(v).replace(".",","):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(";")).join("\r\n");
  if(!S.downloads){toast("La descarga no está disponible aquí");return}
  try{await S.downloads.save({filename:`alquileres_${S.year}.csv`,data:new Blob([csv],{type:"text/csv"})})}catch(e){toast("Descarga cancelada")}
}

/* ---- análisis ---- */
function mesesHasta(){const now=new Date();const lim=S.year<now.getFullYear()?12:S.year>now.getFullYear()?0:now.getMonth()+1;
  return S.month==="all"?[...Array(lim).keys()].map(i=>i+1):(S.month<=lim?[S.month]:[])}
function faltanFacturas(){
  const out=[];const ms=mesesHasta();
  ["luz","gas","agua","internet"].forEach(c=>{
    const cov=new Set();let any=false;
    S.movs.forEach(m=>{if(m.tipo==="gasto"&&m.categoria===c){alloc(m).forEach(a=>{if(a.ym&&a.ym.startsWith(S.year+"-")){cov.add(+a.ym.slice(5,7));any=true}})}});
    if(!any)return;
    const miss=ms.filter(m=>!cov.has(m));
    if(miss.length)out.push({c,miss,txt:CATS[c][0].split(" ")[0].toLowerCase()+" "+miss.map(m=>MES3[m-1].toLowerCase()).join(", ")});
  });
  return out;
}
function porMes(){
  const M=Array.from({length:12},()=>({ing:0,cons:0,sumi:0,alq:0,casa:0,cas:{}}));
  S.movs.forEach(m=>alloc(m).forEach(a=>{if(!a.ym||!a.ym.startsWith(S.year+"-"))return;const x=M[+a.ym.slice(5,7)-1];
    if(m.tipo==="ingreso"){x.ing+=a.v;x.cons+=a.v*((+((m.desglose||{}).consumos)||0)/((+m.importe)||1))}
    else{const c=CATS[m.categoria]?m.categoria:"otros";if(isCasa(m)){x.casa+=a.v;x.cas[c]=(x.cas[c]||0)+a.v}else{x.alq+=a.v;if(CATS[c][2])x.sumi+=a.v}}}));
  return M;
}
const sgn=v=>`<span class="num ${v>=0?"in":"out"}">${v>=0?"+":"−"}${fmt(Math.abs(v))}</span>`;
function tabla(head,rows,foot){return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${head.map((x,i)=>`<th style="text-align:${i?"right":"left"};color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)">${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td style="text-align:${i?"right":"left"};padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap">${x}</td>`).join("")}</tr>`).join("")}${foot?`<tr>${foot.map((x,i)=>`<td style="text-align:${i?"right":"left"};padding:8px 4px;font-weight:700">${x}</td>`).join("")}</tr>`:""}</table></div>`}

function openAnSum(){
  const t=totals();const M=porMes();const ms=S.month==="all"?[...Array(12).keys()]:[S.month-1];
  const rows=ms.filter(i=>M[i].sumi||M[i].cons).map(i=>[MES3[i],fmt(M[i].sumi),fmt(M[i].cons),sgn(M[i].cons-M[i].sumi)]);
  const dif=t.cons-t.sumi;const N=partes();const parte=t.sumi/N;
  const hs=rooms().filter(r=>r.activa!==false).map(r=>{let c=0;S.movs.forEach(m=>{if(m.tipo==="ingreso"&&m.habitacion===r.id&&inPeriod(m.mesCuota))c+=+((m.desglose||{}).consumos)||0});return {r,c,d:c-parte}});
  const falt=faltanFacturas();
  // explicaciones automáticas
  const ex=[];
  if(falt.length)ex.push(`<b>Faltan facturas por apuntar</b> (${esc(falt.map(f=>f.txt).join("; "))}). Los consumos de esos meses ya se han cobrado pero su coste aún no está, así que esos meses salen a favor y el total no es definitivo.`);
  const malos=ms.filter(i=>M[i].sumi&&M[i].cons-M[i].sumi<0);
  if(malos.length){const tot=malos.reduce((x,i)=>x+M[i].sumi-M[i].cons,0);ex.push(`<b>En ${malos.map(i=>MES3[i].toLowerCase()).join(", ")} el coste superó a las cuotas</b> en ${fmt(tot)} en total (sobre todo por la calefacción de gas en invierno). En los meses de verano las cuotas sobran y compensan una parte.`)}
  const bajos=hs.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
  bajos.forEach(x=>{const cu=+x.r.consumos||0;ex.push(`<b>${esc(x.r.nombre)}</b> ha pagado ${fmt(x.c)} de consumos y su parte del coste (1/${N}) es ${fmt(parte)}: aporta ${fmt(-x.d)} menos de lo que gasta.${cu&&x.c<cu*mesesHasta().length*0.8?" Ha estado pagando una cuota de consumos más baja que la actual ("+fmt(cu)+"/mes) durante parte del periodo.":""}`)});
  hs.filter(x=>x.d>0).forEach(x=>ex.push(`<b>${esc(x.r.nombre)}</b> paga ${fmt(x.d)} más de su parte, lo que compensa a las demás.`));
  if(N&&mesesHasta().length){const mm=mesesHasta().length;ex.push(`Para cubrir el coste real hasta ahora, la cuota media de consumos debería ser de unos <b>${fmt(t.sumi/mm/N)}</b> al mes por habitación.`)}
  const bg=sheet(`<h3><span>💡 Análisis de suministros</span><button class="btn ghost" data-x>Cerrar</button></h3>
   <div class="card"><div class="row"><span>Coste real</span><b class="num out">${fmt(t.sumi)}</b></div><div class="row"><span>Cuotas de consumos cobradas</span><b class="num in">${fmt(t.cons)}</b></div><div class="row"><b>Diferencia</b>${sgn(dif)}</div></div>
   <div class="card"><h2>Por qué sale esta diferencia</h2>${ex.length?ex.map(x=>`<p style="margin:0 0 10px;font-size:14px;line-height:1.45">• ${x}</p>`).join(""):'<p class="small muted">Las cuotas cubren el coste.</p>'}</div>
   <div class="card"><h2>Mes a mes</h2>${tabla(["Mes","Coste","Cuotas","Diferencia"],rows,["Total",fmt(t.sumi),fmt(t.cons),sgn(dif)])}</div>
   <div class="card"><h2>Por habitación <span class="sub">parte de cada una: 1/${N} = ${fmt(parte)}</span></h2>${tabla(["Habitación","Pagado","Su parte","Diferencia"],hs.map(x=>[esc(x.r.nombre),fmt(x.c),fmt(parte),sgn(x.d)]))}</div>
   <div class="card"><h2>Por suministro</h2>${tabla(["Suministro","Coste"],["luz","gas","agua","internet"].map(c=>[CATS[c][1]+" "+esc(CATS[c][0]),fmt(t.cat[c]||0)]))}</div>`);
  bg.querySelector("[data-x]").onclick=closeSheet;
}

function openAnCasa(){
  const t=totals();const M=porMes();const ms=S.month==="all"?[...Array(12).keys()]:[S.month-1];
  const resA=t.ing-t.gasA;const resT=resA-t.gasC;
  const rows=ms.filter(i=>M[i].ing||M[i].casa||M[i].alq).map(i=>{const n=M[i].ing-M[i].alq;return [MES3[i],fmt(n),fmt(M[i].casa),sgn(n-M[i].casa)]});
  const casaCats=Object.keys(CATS).filter(c=>CATS[c][3]&&t.cat[c]).sort((a,b)=>t.cat[b]-t.cat[a]);
  const hasta=new Set(mesesHasta().map(m=>m-1));
  const nm=Math.max(1,ms.filter(i=>hasta.has(i)).length);
  const ex=[];
  ex.push(`El alquiler deja <b>${fmt(resA)}</b> (cobros ${fmt(t.ing)} menos gastos del alquiler ${fmt(t.gasA)}) y los gastos de la casa suman <b>${fmt(t.gasC)}</b>: ${resT>=0?"sobran":"faltan"} <b>${fmt(Math.abs(resT))}</b>.`);
  if(casaCats.length){const c0=casaCats[0];ex.push(`La partida más grande es <b>${esc(CATS[c0][0].toLowerCase())}</b>: ${fmt(t.cat[c0])}, el ${Math.round(t.cat[c0]/Math.max(1,resA)*100)}% de lo que deja el alquiler.`)}
  ex.push(`De media, el alquiler deja <b>${fmt(resA/nm)}</b> al mes y la casa cuesta <b>${fmt(t.gasC/nm)}</b> al mes: ${resT>=0?"sobran":"faltan"} unos <b>${fmt(Math.abs(resT)/nm)}</b> al mes.`);
  const neg=ms.filter(i=>hasta.has(i)&&(M[i].ing-M[i].alq)-M[i].casa<0);
  if(neg.length)ex.push(`Los meses en negativo son ${neg.map(i=>MES3[i].toLowerCase()).join(", ")}.`);
  const falt=faltanFacturas();
  if(falt.length)ex.push(`Faltan facturas de suministros por apuntar (${esc(falt.map(f=>f.txt).join("; "))}). Por eso los últimos meses salen mejor de lo que son: cuando se apunten, lo que deja el alquiler bajará.`);
  const anual=S.movs.filter(m=>isCasa(m)&&m.periodoDesde&&m.periodoHasta&&m.periodoDesde.slice(0,4)!==m.periodoHasta.slice(0,4)||isCasa(m)&&m.periodoDesde&&m.periodoHasta&&((Date.parse(m.periodoHasta)-Date.parse(m.periodoDesde))/864e5)>300);
  if(anual.length)ex.push(`Hay gastos anuales (${esc([...new Set(anual.map(m=>(CATS[m.categoria]||CATS.otros)[0].toLowerCase()))].join(", "))}) repartidos en los 12 meses, también en los que aún no han llegado.`);
  const bg=sheet(`<h3><span>🏦 Análisis: alquiler frente a la casa</span><button class="btn ghost" data-x>Cerrar</button></h3>
   <div class="card"><div class="row"><span>Lo que deja el alquiler</span>${sgn(resA)}</div><div class="row"><span>Gastos de la casa</span><b class="num out">−${fmt(t.gasC)}</b></div><div class="row"><b>Resultado</b>${sgn(resT)}</div></div>
   <div class="card"><h2>Por qué sale este resultado</h2>${ex.map(x=>`<p style="margin:0 0 10px;font-size:14px;line-height:1.45">• ${x}</p>`).join("")}</div>
   <div class="card"><h2>Gastos de la casa por partida</h2>${tabla(["Partida","Importe","% del alquiler"],casaCats.map(c=>[`<a href="#" data-c="${c}" style="color:inherit">${CATS[c][1]} ${esc(CATS[c][0])}</a>`,fmt(t.cat[c]),Math.round(t.cat[c]/Math.max(1,resA)*100)+"%"]),["Total",fmt(t.gasC),Math.round(t.gasC/Math.max(1,resA)*100)+"%"])}</div>
   <div class="card"><h2>Mes a mes</h2>${tabla(["Mes","Deja el alquiler","Casa","Resultado"],rows)}</div>`);
  bg.querySelector("[data-x]").onclick=closeSheet;
  bg.querySelectorAll("[data-c]").forEach(a=>a.onclick=e=>{e.preventDefault();openCat(a.dataset.c)});
}

/* ---- detalle de partida ---- */
function openCat(c){
  const casaAll=c==="__casa";
  const match=m=>m.tipo==="gasto"&&(casaAll?isCasa(m):((CATS[m.categoria]?m.categoria:"otros")===c));
  const info=casaAll?["Gastos de la casa","🏦"]:CATS[c];
  const byM=Array(12).fill(0);const items=[];
  S.movs.filter(match).forEach(m=>{let inY=false;alloc(m).forEach(a=>{if(a.ym&&a.ym.startsWith(S.year+"-")){byM[+a.ym.slice(5,7)-1]+=a.v;inY=true}});if(inY)items.push(m)});
  items.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const tot=byM.reduce((x,y)=>x+y,0);const mx=Math.max(1,...byM);
  const bg=sheet(`<h3><span>${info[1]} ${esc(info[0])} · ${S.year}</span><button class="btn ghost" data-x>Cerrar</button></h3>
   <div class="card" style="padding:12px 14px"><div class="row"><b>Total del año</b><b class="num out">${fmt(tot)}</b></div>
   <div class="bars" style="margin-top:8px">${byM.map((v,i)=>`<div class="bar" style="grid-template-columns:44px 1fr 84px"><span class="small">${MES3[i]}</span><div class="t"><i style="width:${v?Math.max(2,v/mx*100):0}%;${casaAll||(CATS[c]&&CATS[c][3])?"background:#7a68a8":""}"></i></div><span class="num small" style="text-align:right">${v?fmt(v):"—"}</span></div>`).join("")}</div>
   <div class="small muted" style="margin-top:8px">Las facturas con periodo se reparten entre los meses que cubren.</div></div>
   <div class="card" style="padding:4px 14px"><h2 style="margin:10px 0 0">Movimientos <span class="sub">toca para corregir o borrar</span></h2>
   ${items.length?items.map(m=>{const ci=CATS[m.categoria]||CATS.otros;return `<div class="mov" data-m="${m._id}"><div class="ic g">${ci[1]}</div><div class="b"><div class="t">${esc(m.proveedor||ci[0])}</div><div class="s">${esc((m.fecha||"").split("-").reverse().join("/"))}${m.periodoDesde?" · "+esc(m.periodoDesde.split("-").reverse().join("/"))+"–"+esc((m.periodoHasta||"").split("-").reverse().join("/")):""}${m.concepto?" · "+esc(m.concepto):""}</div></div><div class="num out" style="font-weight:700">${fmt(m.importe)}</div></div>`}).join(""):`<div class="empty">No hay gastos de esta partida en ${S.year}.</div>`}</div>
   ${S.canWrite===false?"":`<button class="btn block" data-new>+ Añadir ${casaAll?"gasto de la casa":"gasto de "+esc(info[0].toLowerCase())}</button>`}`);
  bg.querySelector("[data-x]").onclick=closeSheet;
  bg.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{const m=S.movs.find(x=>x._id===el.dataset.m);if(m)openGasto(m)});
  const nb=bg.querySelector("[data-new]");if(nb)nb.onclick=()=>openGasto(null,null,false,{categoria:casaAll?"hipoteca":c});
}

/* ---- ingreso ---- */
function openIngreso(m,pre){
  const isNew=!m;m=m||{};pre=pre||{};
  const hab=m.habitacion||pre.habitacion||((rooms().find(r=>r.activa!==false)||{}).id)||"";
  const d=m.desglose||{};
  const bg=sheet(`<h3>${isNew?"Registrar cobro":"Cobro"} <button class="btn ghost" data-x>Cerrar</button></h3>
   <div class="f"><label>Habitación</label><select id="iHab">${rooms().map(r=>`<option value="${esc(r.id)}" ${r.id===hab?"selected":""}>${esc(r.nombre)}${r.inquilino?" · "+esc(r.inquilino):""}</option>`).join("")}</select></div>

function bindDelete(bg,m){
  const d=bg.querySelector("[data-del]");if(!d)return;
  if(S.canWrite===false){d.remove();bg.querySelector("[data-save]").remove();return}
  d.onclick=async()=>{
    if(d.dataset.sure!=="1"){d.dataset.sure="1";d.textContent="¿Seguro? Toca otra vez";return}
    d.disabled=true;
    try{await S.db.collection("movimientos").doc(m._id).delete();if(m.adjunto&&m.adjunto.id)S.assets.remove(m.adjunto.id).catch(()=>{});closeSheet();toast("Borrado")}catch(e){d.disabled=false;toast(errMsg(e))}
  };
}

async function saveMov(m,data,btn){
  if(S.canWrite===false){toast("Solo lectura");return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Guardando';
  try{
    if(m._id){const keep={};["creadoPor","creadoEn","adjunto"].forEach(k=>{if(m[k]!==undefined&&data[k]===undefined)keep[k]=m[k]});
      await S.db.collection("movimientos").doc(m._id).set(Object.assign(keep,data,{editadoEn:new Date().toISOString()}))}
    else{let uid=null;try{uid=S.user?await S.user.id():null}catch(_){}
      await S.db.collection("movimientos").doc().set(Object.assign(data,{creadoPor:uid,creadoEn:new Date().toISOString()}))}
    closeSheet();toast("Guardado");
  }catch(e){btn.disabled=false;btn.textContent="Guardar";
    if(e&&e.code==="invalid_argument"&&S.canWrite==null){S.canWrite=false;render()}
    toast(errMsg(e))}
}
function errMsg(e){const c=e&&e.code;
  if(c==="quota_exceeded")return "La base de datos está llena: borra movimientos antiguos.";
  if(c==="invalid_argument")return "No tienes permiso para guardar o el dato no es válido.";
  if(c==="resource_exhausted")return "Demasiadas operaciones seguidas; espera un momento.";
  return "No se pudo guardar. Inténtalo de nuevo."}

function makeDb(){
  const T={config:{m:new Map(),ls:[],ok:false},movimientos:{m:new Map(),ls:[],ok:false}};
  const emit=t=>T[t].ls.forEach(f=>f());
  async function load(t){const {data,error}=await SB.from(t).select("id,data");if(error){T[t].err=error;emit(t);return}
    T[t].m=new Map(data.map(r=>[r.id,r.data]));T[t].ok=true;T[t].err=null;emit(t)}
  const reload=()=>{load("config");load("movimientos")};
  SB.channel("cambios")
    .on("postgres_changes",{event:"*",schema:"public",table:"movimientos"},p=>{if(p.eventType==="DELETE")T.movimientos.m.delete(p.old.id);else T.movimientos.m.set(p.new.id,p.new.data);emit("movimientos")})
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},p=>{if(p.eventType!=="DELETE"){T.config.m.set(p.new.id,p.new.data);emit("config")}})
    .subscribe(st=>{if(st==="SUBSCRIBED")reload()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reload()});
  reload();
  const snapDoc=(t,id)=>({id,exists:T[t].m.has(id),data:()=>T[t].m.get(id),metadata:{fromCache:!T[t].ok}});
  const rowRef=(t,id)=>({id,
    async set(d){const {error}=await SB.from(t).upsert({id,data:d});if(error)throw error;T[t].m.set(id,d);emit(t)},
    async delete(){const {error}=await SB.from(t).delete().eq("id",id);if(error)throw error;T[t].m.delete(id);emit(t)},
    onSnapshot(cb,err){const f=()=>{if(T[t].err&&err)err(T[t].err);else cb(snapDoc(t,id))};T[t].ls.push(f);if(T[t].ok)f();return()=>{}}});
  return {
    doc(path){const [t,id]=path.split("/");return rowRef(t,id)},
    collection(t){return {doc:id=>rowRef(t,id||(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))),
      onSnapshot(cb,err){const f=()=>{if(T[t].err&&err)return err(T[t].err);const docs=[...T[t].m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:!T[t].ok}})};T[t].ls.push(f);if(T[t].ok)f();return()=>{}}}}
  };
}

const destinoTxt=d=>d==="todas"?"Todas las habitaciones":d==="familia"?"Solo familia":roomName(d);
const tamTxt=n=>!n?"":n>1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function cargarDocs(){
  const {data,error}=await SB.from("documentos").select("*").order("creado_en",{ascending:false});
  if(error){S.docs=[];S.docsErr=true;return}
  S.docsErr=false;S.docs=data||[];
  if(S.docs.length){const {data:urls}=await SB.storage.from("documentos").createSignedUrls(S.docs.map(d=>d.path),3600);
    (urls||[]).forEach((u,i)=>{if(S.docs[i])S.docs[i].url=u.signedUrl})}
}
function docRow(d,del){const ic=(d.tipo||"").includes("pdf")?"📕":(d.tipo||"").startsWith("image/")?"🖼️":"📄";
  return `<div class="mov" style="cursor:default"><div class="ic" style="background:var(--accent-soft)">${ic}</div><div class="b"><div class="t">${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(d.titulo)}</a>`:esc(d.titulo)}</div><div class="s">${del?esc(destinoTxt(d.destino))+" · ":""}${esc(new Date(d.creado_en).toLocaleDateString("es-ES"))}${d.tamano?" · "+tamTxt(d.tamano):""}</div></div>${d.url?`<a class="btn sec" href="${esc(d.url)}" target="_blank" rel="noopener" style="padding:8px 12px;min-height:0;text-decoration:none">Abrir</a>`:""}${del?`<button class="xbtn" data-deldoc="${esc(d.id)}" title="Borrar" style="margin-left:6px">×</button>`:""}</div>`}
function viewDocs(){
  if(!S.docs){cargarDocs().then(render);return `<div class="empty"><span class="spin"></span>Cargando documentos…</div>`}
  let h=`<div class="card"><h2>Subir documento</h2>
   <div class="f"><label>Archivo (PDF, Word, foto…)</label><input type="file" id="dFile"></div>
   <div class="f"><label>Título</label><input id="dTit" placeholder="Contrato Bardenas 2026, Normas de la casa…"></div>
   <div class="f"><label>Quién lo puede ver</label><select id="dDest"><option value="todas">Todas las habitaciones</option>${rooms().map(r=>`<option value="${esc(r.id)}">Solo ${esc(r.nombre)}${r.inquilino?" ("+esc(r.inquilino)+")":""}</option>`).join("")}<option value="familia">Solo la familia</option></select></div>
   <button class="btn block" id="dUp">Subir</button></div>`;
  if(S.docsErr)h+=`<div class="notice err">No se pudieron cargar los documentos.</div>`;
  const grupos=["todas",...rooms().map(r=>r.id),"familia"];
  grupos.forEach(g=>{const ds=(S.docs||[]).filter(d=>d.destino===g);if(!ds.length)return;
    h+=`<div class="card"><h2>${esc(destinoTxt(g))} <span class="sub">${ds.length}</span></h2>${ds.map(d=>docRow(d,true)).join("")}</div>`});
  if(!(S.docs||[]).length)h+=`<div class="card empty">Todavía no hay documentos.</div>`;
  return h;
}
function bindDocs(){
  const f=$("#dFile");if(f)f.onchange=()=>{const x=f.files[0];if(x&&!$("#dTit").value)$("#dTit").value=x.name.replace(/\.[^.]+$/,"")};
  const up=$("#dUp");if(up)up.onclick=async()=>{
    const file=f.files[0],titulo=$("#dTit").value.trim(),destino=$("#dDest").value;
    if(!file){toast("Elige un archivo");return}if(!titulo){toast("Pon un título");return}
    if(file.size>20*1048576){toast("El archivo pasa de 20 MB");return}
    up.disabled=true;up.innerHTML='<span class="spin"></span>Subiendo';
    const ext=((file.name||"").split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,6)||"bin";
    const path=`${destino}/${crypto.randomUUID?crypto.randomUUID():Date.now()}.${ext}`;
    const {error:e1}=await SB.storage.from("documentos").upload(path,file,{contentType:file.type||undefined});
    if(e1){up.disabled=false;up.textContent="Subir";toast("No se pudo subir: "+e1.message);return}
    const {error:e2}=await SB.from("documentos").insert({titulo,destino,path,tipo:file.type||null,tamano:file.size,creado_por:S.email});
    if(e2){await SB.storage.from("documentos").remove([path]);up.disabled=false;up.textContent="Subir";toast("No se pudo guardar: "+e2.message);return}
    toast("Documento subido");await cargarDocs();render()};
  document.querySelectorAll("[data-deldoc]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="¿?";b.style.width="auto";b.style.padding="0 10px";return}
    const d=S.docs.find(x=>x.id===b.dataset.deldoc);if(!d)return;b.disabled=true;
    const {error}=await SB.from("documentos").delete().eq("id",d.id);
    if(error){toast("No se pudo borrar");b.disabled=false;return}
    await SB.storage.from("documentos").remove([d.path]);toast("Borrado");await cargarDocs();render()});
}

/* ---------- vista del inquilino ---------- */
function cargarInquilino(d){
  S.tenant=d;S.modo="alquiler";S.partesFijas=+d.partes||1;
  S.config={casa:d.casa,habitaciones:[d.habitacion],partidas:d.partidas||[],reparto:"alquiladas"};rebuildCats();
  S.movs=(d.movimientos||[]).map(r=>Object.assign({_id:r.id},r.data));S.movsLoaded=S.cfgLoaded=true;
}
async function arrancarInquilino(session,d){
  document.body.classList.remove("out");document.body.classList.add("tenant");
  S.email=session.user.email;cargarInquilino(d);render();
  cargarDocs().then(render);
  if(!S._tenantVis){S._tenantVis=true;document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible")return;const t=await SB.rpc("datos_inquilino");if(!t.error&&t.data){cargarInquilino(t.data);render()}})}
}
function viewTenant(){
  const d=S.tenant,r=d.habitacion,id=r.id;
  const per=S.month==="all"?`Año ${S.year}`:`${MESES[S.month-1]} ${S.year}`;
  const c=cobrosHab(id),g=gastosHab(id),p=pendientesHab(id);
  let h=`<div class="card"><h2 style="font-size:20px;margin-bottom:4px">Hola${d.nombre?" "+esc(d.nombre):""}</h2>
    <div class="muted">Habitación <b>${esc(r.nombre)}</b>${d.casa?" · "+esc(d.casa):""}</div>
    ${cuotaHab(r)?`<div class="small muted" style="margin-top:6px">Tu cuota mensual: ${fmt(cuotaHab(r))} (alquiler ${fmt(r.alquiler)}, consumos ${fmt(r.consumos)}${+r.limpieza?", limpieza "+fmt(r.limpieza):""}${+r.otros?", "+esc((r.otrosConcepto||"otros").toLowerCase())+" "+fmt(r.otros):""})</div>`:""}</div>
   <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="l">Has pagado · ${per}</div><div class="v in">${fmt(c.tot)}</div></div>
    <div class="kpi"><div class="l">Meses pendientes</div><div class="v ${p.length?"out":"in"}">${p.length}</div></div></div>`;
  if(p.length)h+=`<div class="notice">Pagos pendientes: ${p.map(ym=>ymLabel(ym)).join(", ")}</div>`;
  const months=S.month==="all"?[...Array(12).keys()].map(i=>i+1):[S.month];const now=ymNow();
  h+=`<div class="card"><h2>Tus pagos <span class="sub">${per}</span></h2>`;let any=false;
  months.forEach(m=>{const ym=S.year+"-"+String(m).padStart(2,"0");
    const f=S.movs.filter(x=>x.tipo==="ingreso"&&x.habitacion===id&&x.mesCuota===ym);
    f.forEach(x=>{any=true;const q=x.desglose||{};h+=`<div class="mov" style="cursor:default"><div class="ic i">✓</div><div class="b"><div class="t">${MESES[m-1]}</div><div class="s">Alq. ${fmt(q.alquiler)} · Cons. ${fmt(q.consumos)}${+q.limpieza?" · Limp. "+fmt(q.limpieza):""}${+q.otros?" · "+esc(r.otrosConcepto||"Otros")+" "+fmt(q.otros):""}</div></div><div class="num in" style="font-weight:700">${fmt(x.importe)}</div></div>`});
    if(!f.length&&p.includes(ym)){any=true;h+=`<div class="mov" style="cursor:default"><div class="ic" style="background:#f3e6c8">!</div><div class="b"><div class="t">${MESES[m-1]}</div><div class="s">Pendiente</div></div><div class="num muted">—</div></div>`}
  });
  if(!any)h+=`<div class="small muted">No hay pagos en este periodo.</div>`;
  h+=`<div class="row" style="margin-top:6px;border-top:2px solid var(--line)"><span>Alquiler ${fmt(c.d.alquiler)} · Consumos ${fmt(c.d.consumos)}${c.d.limpieza?" · Limpieza "+fmt(c.d.limpieza):""}${c.d.otros?" · "+esc(r.otrosConcepto||"Otros")+" "+fmt(c.d.otros):""}</span></div></div>`;
  if(g.propios.length)h+=`<div class="card"><h2>Gastos de tu habitación <span class="sub">${fmt(g.prop)}</span></h2>`+g.propios.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(m=>{const ci=CATS[m.categoria]||CATS.otros;return `<div class="mov" style="cursor:default"><div class="ic g">${ci[1]}</div><div class="b"><div class="t">${esc(m.proveedor||ci[0])}</div><div class="s">${esc(ci[0])}${m.concepto?" · "+esc(m.concepto):""} · ${esc((m.fecha||"").split("-").reverse().join("/"))}</div></div><div class="num out" style="font-weight:700">${fmt(m.importe)}</div></div>`}).join("")+`</div>`;
  h+=`<div class="card"><h2>Documentos</h2>${S.docs==null?'<div class="small muted"><span class="spin"></span>Cargando…</div>':S.docs.length?S.docs.map(d=>docRow(d,false)).join(""):'<div class="small muted">No hay documentos.</div>'}</div>`;
  h+=`<div class="card"><p class="small muted" style="margin-top:0">Usuario: ${esc((S.email||"").replace("@"+DOMINIO_HAB,""))}</p><button class="btn sec block" id="tLogout">Cerrar sesión</button></div>`;
  return h;
}
function bindTenant(){
  const lo=$("#tLogout");if(lo)lo.onclick=async()=>{await SB.auth.signOut();location.reload()};
  document.querySelectorAll("[data-tcat]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.tcat,N=partes();const byM=Array(12).fill(0);const items=[];
    S.movs.filter(m=>m.tipo==="gasto"&&(m.habitacion||"casa")==="casa"&&((CATS[m.categoria]?m.categoria:"otros")===c)).forEach(m=>{let inY=false;alloc(m).forEach(a=>{if(a.ym&&a.ym.startsWith(S.year+"-")){byM[+a.ym.slice(5,7)-1]+=a.v/N;inY=true}});if(inY)items.push(m)});
    items.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));const mx=Math.max(1,...byM);
    const bg=sheet(`<h3><span>${CATS[c][1]} ${esc(CATS[c][0])} · ${S.year}</span><button class="btn ghost" data-x>Cerrar</button></h3>
     <div class="card"><h2>Tu parte por meses <span class="sub">${fmt(byM.reduce((x,y)=>x+y,0))}</span></h2><div class="bars">${byM.map((v,i)=>`<div class="bar" style="grid-template-columns:44px 1fr 84px"><span class="small">${MES3[i]}</span><div class="t"><i style="width:${v?Math.max(2,v/mx*100):0}%"></i></div><span class="num small" style="text-align:right">${v?fmt(v):"—"}</span></div>`).join("")}</div></div>
     <div class="card"><h2>Facturas</h2>${items.map(m=>`<div class="row"><span>${esc(m.proveedor||CATS[c][0])}<br><span class="small muted">${esc((m.fecha||"").split("-").reverse().join("/"))}${m.periodoDesde?" · "+esc(m.periodoDesde.split("-").reverse().join("/"))+"–"+esc((m.periodoHasta||"").split("-").reverse().join("/")):""}</span></span><span class="num" style="text-align:right">${fmt(m.importe)}<br><span class="small muted">tu parte ${fmt(m.importe/N)}</span></span></div>`).join("")||'<div class="small muted">Sin facturas.</div>'}</div>`);
    bg.querySelector("[data-x]").onclick=closeSheet;
  });
}

function loginView(msg,modo){
  document.body.classList.add("out");
  const logo=document.querySelector(".brand svg.logo").outerHTML;
  $("#main").innerHTML=`<div class="login"><div class="logo-big">${logo}</div>
   <div class="card"><h2 style="justify-content:center">${modo==="alta"?"Crear cuenta":"Entrar"}</h2>
    ${msg?`<div class="notice">${msg}</div>`:""}
    <form id="lf"><div class="f"><label>${modo==="alta"?"Correo":"Usuario o correo"}</label><input id="lEmail" type="${modo==="alta"?"email":"text"}" autocapitalize="none" autocorrect="off" autocomplete="username" required></div>
    <div class="f"><label>Contraseña</label><input id="lPass" type="password" autocomplete="${modo==="alta"?"new-password":"current-password"}" minlength="6" required></div>
    <button class="btn block" id="lBtn">${modo==="alta"?"Crear cuenta":"Entrar"}</button></form>
    <button class="btn ghost block" id="lAlt" style="margin-top:8px">${modo==="alta"?"Ya tengo cuenta: entrar":"Familia: crear cuenta"}</button>
    ${modo==="alta"?"":`<button class="btn ghost block" id="lOlv">He olvidado la contraseña</button>`}</div></div>`;
  $("#lAlt").onclick=()=>loginView("",modo==="alta"?"entrar":"alta");
  const ol=$("#lOlv");if(ol)ol.onclick=async()=>{const e=$("#lEmail").value.trim();if(!e){toast("Escribe primero tu correo");return}
    if(!e.includes("@")){loginView("Si entras con un usuario de habitación, pide a la familia que te ponga una contraseña nueva.","entrar");return}
    const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
    loginView(error?"No se pudo enviar: "+esc(error.message):"Te hemos enviado un correo para cambiar la contraseña.","entrar")};
  $("#lf").onsubmit=async ev=>{ev.preventDefault();const b=$("#lBtn");b.disabled=true;b.innerHTML='<span class="spin"></span>Un momento';
    let email=$("#lEmail").value.trim().toLowerCase();const password=$("#lPass").value;
    if(modo!=="alta"&&!email.includes("@"))email=email+"@"+DOMINIO_HAB;
    if(modo==="alta"){const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error)return loginView(esc(traducirError(error.message)),"alta");
      if(!data.session)return loginView("Cuenta creada. Revisa tu correo y pulsa el enlace de confirmación; después vuelve aquí y entra.","entrar");
    }else{const {error}=await SB.auth.signInWithPassword({email,password});if(error)return loginView(esc(traducirError(error.message)),"entrar")}
    arrancar()};
}
function traducirError(m){m=m||"";
  if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(m))return "Aún no has confirmado el correo. Busca el mensaje de confirmación en tu bandeja de entrada.";
  if(/already registered/i.test(m))return "Ese correo ya tiene cuenta. Pulsa \"Ya tengo cuenta: entrar\".";
  if(/Password should be/i.test(m))return "La contraseña debe tener al menos 6 caracteres.";
  return m;}

let arrancado=false;
async function arrancar(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return loginView("","entrar");
  // nueva contraseña tras el enlace de recuperación
  let {data:ok,error}=await SB.rpc("es_miembro");
  if(!error&&!ok){const r=await SB.rpc("reclamar_primer_acceso");if(r.data===true)ok=true}
  if(!error&&!ok){const t=await SB.rpc("datos_inquilino");if(!t.error&&t.data){return arrancarInquilino(session,t.data)}}
  if(error||!ok){document.body.classList.add("out");
    $("#main").innerHTML=`<div class="login"><div class="card"><h2>Sin acceso todavía</h2><p>Has entrado como <b>${esc(session.user.email)}</b>, pero esta cuenta aún no tiene acceso a la aplicación. Pide a quien la administra que añada tu correo en Casa → Personas con acceso.</p><button class="btn sec block" id="lo2">Cerrar sesión</button></div></div>`;
    $("#lo2").onclick=async()=>{await SB.auth.signOut();location.reload()};return}
  document.body.classList.remove("out");
  if(arrancado)return;arrancado=true;
  S.email=session.user.email;
  S.db=makeDb();S.assets=ASSETS;S.downloads=DOWNLOADS;S.sample=null;S.canWrite=true;
  S.user={id:async()=>S.email,can:async()=>true,profiles:async ids=>{await cargarMiembros();return Object.fromEntries(ids.map(id=>[id,{name:S.miembros[id]||String(id).split("@")[0]}]))}};
  render();
  S.timer=setTimeout(()=>{S.stale=true;render()},10000);
  const clear=()=>{if(S.timer){clearTimeout(S.timer);S.timer=null}if(S.stale){S.stale=false}};
  S.db.doc("config/main").onSnapshot(snap=>{S.config=snap.exists?snap.data():null;rebuildCats();S.cfgLoaded=true;if(!snap.metadata.fromCache)clear();render()},
    ()=>{S.cfgLoaded=true;clear();render()});
  S.db.collection("movimientos").onSnapshot(snap=>{
    S.movs=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));S.movsLoaded=true;if(!snap.metadata.fromCache)clear();
    resolveNames();render()},
    ()=>{S.movsLoaded=true;clear();render()});
}
SB.auth.onAuthStateChange(async(ev)=>{
  if(ev==="PASSWORD_RECOVERY"){document.body.classList.add("out");
    $("#main").innerHTML=`<div class="login"><div class="card"><h2>Nueva contraseña</h2><form id="np"><div class="f"><input id="npP" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn block">Guardar</button></form></div></div>`;
    $("#np").onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.updateUser({password:$("#npP").value});if(error)toast(traducirError(error.message));else{toast("Contraseña cambiada");history.replaceState(null,"",location.pathname);arrancar()}}}
});
async function resolveNames(){
  if(!S.user||!S.user.profiles)return;
  const ids=[...new Set(S.movs.map(m=>m.creadoPor).filter(Boolean))].filter(id=>!(id in S.names));
  if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);let ch=false;ids.forEach(id=>{const n=(ps[id]&&ps[id].name)||"";S.names[id]=n.split(" ")[0];ch=ch||!!n});if(ch&&S.view==="movimientos")render()}catch(_){}
}
setTimeout(()=>{if(!location.hash.includes("type=recovery"))arrancar()},0);
})();
</script>
